services:

  # ─── Dashboard API (your infrastructure) ────────────────────────────────────
  api:
    build:
      context: ./dashboard_api
    ports:
      - "8000:8000"
    volumes:
      - ./db_data:/app/db_data
    environment:
      DATABASE_URL: sqlite:////app/db_data/dashboard.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 120s
      timeout: 5s
      retries: 3

  # ─── Frontend Dashboard (your infrastructure) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # ─── Backend Test Engine (runs on client's server in prod) ──────────────────
  engine:
    build:
      context: ./backend
    volumes:
      - ./backend/config:/app/backend/config
      - ./data:/app/data
    environment:
      DQF_API_URL: http://api:8000
      DQF_API_KEY: ${DQF_API_KEY}
    depends_on:
      api:
        condition: service_healthy
