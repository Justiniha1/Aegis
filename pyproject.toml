[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-dq"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "requests>=2.31",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "python-dotenv>=1.0",
    "cryptography>=42.0",
    "rich>=13.0",
]

[project.scripts]
aegis = "cli.cli:app"

[project.optional-dependencies]
airflow = [
    "apache-airflow>=2.7",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "httpx>=0.27",
    "requests-mock>=1.11",
]
postgres = ["psycopg2-binary>=2.9.9"]
mysql = ["PyMySQL>=1.2.0"]
snowflake = ["snowflake-sqlalchemy>=1.10.0"]
mssql = ["pyodbc>=5.3.0"]
all-db = ["psycopg2-binary>=2.9.9", "PyMySQL>=1.2.0", "snowflake-sqlalchemy>=1.10.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "aegis_dq*"]
