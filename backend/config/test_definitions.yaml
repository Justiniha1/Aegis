# ============================================================================
# DATA QUALITY FRAMEWORK - TEST DEFINITIONS
# ============================================================================
# Auto-generated from database. Manual edits will be synced on next engine run.
# ============================================================================

engine: Simple
settings:
  default_profile: dev
  default_severity: MEDIUM
  alerts:
    enabled: true
    slack:
      enabled: true
      webhook_url: ${SLACK_WEBHOOK}
      notify_on:
      - FAILED
      - ERROR
      - PASS
    email:
      enabled: false
      recipients: []
      notify_on:
      - FAILED
      - ERROR
tests:
- name: Customer Email Null Check
  description: Ensure all customers have email addresses for communication
  type: null_check
  severity: HIGH
  tags:
  - customers
  - contact_info
  - critical
  table: customers
  column: email
  threshold: 0.02
- name: Order Total Null Check
  type: null_check
  severity: CRITICAL
  tags:
  - orders
  - revenue
  table: orders
  column: order_total
- name: Customer Email Duplicate Check
  description: Detect duplicate customer email addresses
  type: duplicate_check
  severity: MEDIUM
  tags:
  - customers
  - data_integrity
  table: customers
  columns:
  - email
  max_allowed: 0
- name: Customer Name and Country Duplicate Check
  description: Detect customers with same name AND country (potential duplicates)
  type: duplicate_check
  severity: LOW
  tags:
  - customers
  - data_quality
  table: customers
  columns:
  - first_name
  - last_name
  - country
  max_allowed: 5
- name: Customer ID Uniqueness
  description: Ensure customer_id is unique (primary key validation)
  type: unique_check
  severity: CRITICAL
  tags:
  - customers
  - schema
  - primary_key
  table: customers
  column: customer_id
- name: Order ID Uniqueness
  type: unique_check
  severity: CRITICAL
  tags:
  - orders
  - primary_key
  table: orders
  columns:
  - order_id
- name: Daily Order Volume Check
  description: Ensure minimum daily order volume (detect system outages)
  type: row_count
  severity: HIGH
  tags:
  - orders
  - volume
  - daily
  table: orders
  min_rows: 10
  max_rows: 10000
- name: Total Customer Count Check
  description: Ensure customer table isn't accidentally truncated
  type: row_count
  severity: CRITICAL
  tags:
  - customers
  - volume
  table: customers
  min_rows: 1000
  timeframe: all_time
- name: Weekly Order Volume Check
  type: row_count
  severity: MEDIUM
  tags:
  - orders
  - weekly
  table: orders
  min_rows: 50
  max_rows: 100000
  timeframe: all_time
  date_column: order_date
- name: Customer Table Schema Validation
  description: Ensure customer table has required columns with correct types
  type: schema_check
  severity: HIGH
  tags:
  - customers
  - schema
  table: customers
  expected_columns:
    customer_id: integer
    first_name: string
    last_name: string
    email: string
    signup_date: date
    country: string
    customer_tier: string
- name: Orders Table Schema Validation
  type: schema_check
  severity: HIGH
  tags:
  - orders
  - schema
  table: orders
  expected_columns:
    order_id: integer
    customer_id: integer
    order_date: datetime
    order_total: float
    status: string
    payment_method: string
- name: Product Price Range Check
  description: Detect unrealistic product prices (data entry errors)
  type: range_check
  severity: HIGH
  tags:
  - products
  - pricing
  - outliers
  table: products
  column: price
  min_value: 0.01
  max_value: 10000
  max_outliers: 0
- name: Orders Foreign Key Validation
  description: Ensure all orders reference valid customers
  type: relationship_check
  severity: CRITICAL
  tags:
  - orders
  - referential_integrity
  - foreign_keys
  source_table: orders
  source_column: customer_id
  target_table: customers
  target_column: customer_id
  max_orphans: 0
- name: Order Items to Orders Relationship
  description: Ensure all order items reference valid orders
  type: relationship_check
  severity: HIGH
  tags:
  - order_items
  - referential_integrity
  source_table: order_items
  source_column: order_id
  target_table: orders
  target_column: order_id
  max_orphans: 0
- name: Order Items to Products Relationship
  type: relationship_check
  severity: HIGH
  tags:
  - order_items
  - products
  - referential_integrity
  source_table: order_items
  source_column: product_id
  target_table: products
  target_column: product_id
  max_orphans: 10
- name: Active Orders Without Items Check
  description: Find completed orders with no order items (data integrity issue)
  type: custom_sql
  severity: HIGH
  tags:
  - orders
  - order_items
  - integrity
  query: "SELECT COUNT(*) as orphaned_orders\nFROM orders o\nLEFT JOIN order_items\
    \ oi ON o.order_id = oi.order_id\nWHERE o.status = 'completed'\n  AND oi.order_item_id\
    \ IS NULL\n"
  assertion: orphaned_orders == 0
- name: Product Inventory Below Reorder Point
  description: Monitor products that need restocking
  type: custom_sql
  severity: LOW
  tags:
  - products
  - inventory
  - operations
  query: "SELECT COUNT(*) as low_stock_count\nFROM products\nWHERE stock_quantity\
    \ < 10\n  AND category != 'Digital'\n"
  assertion: low_stock_count < 5
- name: Average Order Value Check
  description: Ensure average order value stays above minimum threshold
  type: custom_sql
  severity: MEDIUM
  tags:
  - orders
  - metrics
  - revenue
  query: 'SELECT COALESCE(AVG(order_total), 0) as avg_order_value

    FROM orders

    WHERE status = ''completed''

    '
  assertion: avg_order_value >= 50
