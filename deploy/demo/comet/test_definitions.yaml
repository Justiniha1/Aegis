
engine: Simple
settings:
  default_profile: demo
  default_severity: MEDIUM
  alerts:
    enabled: false
    slack:
      enabled: false
      webhook_url: ""
      notify_on: []
    email:
      enabled: false
      recipients: []
      notify_on: []
tests:
- name: Customer ID Uniqueness
  description: customer_id is unique (primary key)
  type: unique_check
  severity: CRITICAL
  profile: demo
  table: customers
  column: customer_id
- name: Customer Row Count
  description: Customers table is populated
  type: row_count
  severity: MEDIUM
  profile: demo
  table: customers
  min_rows: 1
  max_rows: 100000
  timeframe: all_time
- name: Orders Reference Valid Customers
  description: Every order points at a real customer
  type: relationship_check
  severity: CRITICAL
  profile: demo
  source_table: orders
  source_column: customer_id
  target_table: customers
  target_column: customer_id
  max_orphans: 0
- name: Customers Schema Validation
  description: customers table has the expected columns
  type: schema_check
  severity: HIGH
  profile: demo
  table: customers
  expected_columns:
    customer_id: integer
    first_name: string
    last_name: string
    email: string
    signup_date: date
    country: string
- name: Customer Email Null Check
  description: Every customer has an email address
  type: null_check
  severity: HIGH
  profile: demo
  table: customers
  column: email
  threshold: 0
- name: Order Total Within Expected Range
  description: Order totals should stay at or below $300 — flags unusually large
    orders for review
  type: range_check
  severity: HIGH
  profile: demo
  table: orders
  column: order_total
  max_value: 300
  max_outliers: 0
- name: Daily Order Volume Floor
  description: Expect at least 60 orders for the period — alerts when volume 
    drops
  type: row_count
  severity: MEDIUM
  profile: demo
  table: orders
  min_rows: 60
  max_rows: 100000
  timeframe: all_time
